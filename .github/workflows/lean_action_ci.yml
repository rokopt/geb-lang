name: Lean Action CI

on:
  push:
    branches:
      - "main"
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@main
      - uses: leanprover/lean-action@main
      - uses: extractions/setup-just@trunk
      - uses: DavidAnson/markdownlint-cli2-action@main
        with:
          config: ".markdownlint-cli2.jsonc"
      - name: Full `just update`/`just build`
        run: |
          sudo apt update && sudo apt install -y bibtool
          just update-and-build
