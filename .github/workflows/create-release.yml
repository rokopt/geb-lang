name: Create Release

# Note that this action is broken -- it never actually detects a release -- by:
#   https://github.com/leanprover-community/lean-release-tag/issues/3

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "src/Lean/Project/lean-toolchain"

jobs:
  lean-release-tag:
    name: Add Lean release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: lean-release-tag action
        uses: leanprover-community/lean-release-tag@main
        with:
          do-release: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
