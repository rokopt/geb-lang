name: Create Release

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "src/Lean/Project/lean-toolchain"

jobs:
  lean-release-tag:
    name: Add Lean release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: lean-release-tag action
        uses: rokopt/lean-release-tag@main
        with:
          toolchain-path: src/Lean/Project/lean-toolchain
          do-release: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
