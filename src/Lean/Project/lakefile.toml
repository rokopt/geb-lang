name = "GebLang"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["GebLang"]
lintDriver = "batteries/runLinter"

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
linter.missingDocs = true
warningAsError = true

[[require]]
name = "cslib"
scope = "leanprover"
rev = "v4.37.0-rc1"

[[require]]
name = "doc-gen4"
scope = "leanprover"
rev = "v4.37.0-rc1"

[[require]]
name = "axiom-audit"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/axiom-audit"
rev = "0b885d88a69982cd76990b502742690b80b1a685"

[[require]]
name = "Canonical-min"
scope = "rokopt"
git = "https://github.com/rokopt/Canonical-min"
rev = "1a67f89ba0c2d944630e48501c4bb257dfa62c8e"

[[require]]
name = "Canonical"
scope = "rokopt"
git = "https://github.com/rokopt/CanonicalLean"
rev = "c57eb57d6baa5f884cca4f1f630068c5bd682a62"

[[require]]
name = "verso"
git = "https://github.com/leanprover/verso.git"
rev = "v4.37.0-rc1"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.37.0-rc1"

[[lean_lib]]
name = "GebLang"
roots = ["GebLang", "GebLang.Manual"]
globs = ["GebLang.*", "GebLang.Manual.*"]
