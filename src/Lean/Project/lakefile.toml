name = "Geb"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Geb"]
lintDriver = "batteries/runLinter"

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
linter.missingDocs = true
warningAsError = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc4"

[[require]]
name = "cslib"
scope = "leanprover"
rev = "v4.35.0-rc4"

[[require]]
name = "doc-gen4"
scope = "leanprover"
rev = "main"

[[require]]
name = "axiom-audit"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/axiom-audit"
rev = "main"

[[require]]
name = "Canonical"
scope = "chasenorman"

[[require]]
name = "verso"
git = "https://github.com/leanprover/verso.git"
rev = "latest"

[[lean_lib]]
name = "Geb"
