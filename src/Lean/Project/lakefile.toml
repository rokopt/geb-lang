name = "GebLang"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["GebLang"]
lintDriver = "batteries/runLinter"

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
linter.missingDocs = true
warningAsError = true

[[require]]
name = "cslib"
scope = "leanprover"
rev = "v4.37.0-rc1"

[[require]]
name = "doc-gen4"
scope = "leanprover"
rev = "v4.37.0-rc1"

[[require]]
name = "axiom-audit"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/axiom-audit"
rev = "0b885d88a69982cd76990b502742690b80b1a685"

[[require]]
name = "Canonical-min"
scope = "rokopt"
git = "https://github.com/rokopt/Canonical-min"
rev = "19f5a0d0759f0f1db259443e656e57890fa5ff5a"

[[require]]
name = "Canonical"
scope = "rokopt"
git = "https://github.com/rokopt/CanonicalLean"
rev = "3f29de5fcfc1953c2847d68c6b2b902a26995632"

[[require]]
name = "verso"
git = "https://github.com/leanprover/verso.git"
rev = "v4.37.0-rc1"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.37.0-rc1"

[[lean_lib]]
name = "GebLang"
roots = ["GebLang", "GebLang.Manual"]
globs = ["GebLang.*", "GebLang.Manual.*"]
