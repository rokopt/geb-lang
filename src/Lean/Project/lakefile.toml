name = "Geb"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Geb"]
lintDriver = "batteries/runLinter"

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
linter.missingDocs = true
warningAsError = true

[[require]]
name = "cslib"
scope = "leanprover"
rev = "v4.36.0-rc1"

[[require]]
name = "doc-gen4"
scope = "leanprover"
rev = "v4.36.0-rc1"

[[require]]
name = "axiom-audit"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/axiom-audit"
rev = "0b885d88a69982cd76990b502742690b80b1a685"

[[require]]
name = "Canonical"
scope = "chasenorman"
rev = "f06340163923d0c05cace3a757206a36cc3cef44"

[[require]]
name = "verso"
git = "https://github.com/leanprover/verso.git"
rev = "v4.36.0-rc1"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc1"

[[lean_lib]]
name = "Geb"
roots = ["Geb", "Geb.Manual"]
